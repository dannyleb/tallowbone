name: Build, test and deploy

# Every push and pull request: import the project, run the headless
# playtest, render screenshots and export the web build. Pushes to main
# also deploy the web build to GitHub Pages, and publish the logs and
# screenshots to the ci-reports branch.
#
# GitHub Pages has to be set to deploy from Actions (one time):
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publishes the ci-reports branch
  pages: write
  id-token: write

# One run at a time per branch; a deploy already under way is allowed to finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-macos

      - name: Download Godot and the web and Mac export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web*' 'templates/macos.zip' 'templates/version.txt' -d templates && rm templates.tpz

      - name: Install Godot
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          # Mesa's software GL and Vulkan (lavapipe): the screenshots draw the
          # 3D stage with the full desktop renderer.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          # .gdignore keeps Godot from importing CI's own output (logs, and
          # the web build when the Mac app is exported after it).
          mkdir -p ci-out/shots build && touch ci-out/.gdignore build/.gdignore

      - name: Import
        timeout-minutes: 5
        run: godot --headless --audio-driver Dummy --path . --import 2>&1 | tee ci-out/import.log

      - name: Playtest
        timeout-minutes: 5
        run: |
          set -o pipefail
          # A runaway (endless loop, memory, an error logged every frame)
          # gets cut off here instead of taking the runner down with it.
          ulimit -v 8000000
          timeout -k 10 240 godot --headless --audio-driver Dummy --path . --fixed-fps 60 --script res://tests/playtest.gd 2>&1 | head -c 20000000 | tee ci-out/playtest.log

      - name: Screenshots
        if: always()
        timeout-minutes: 12
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" timeout -k 10 660 godot --audio-driver Dummy --path . --rendering-driver vulkan --resolution 1280x720 \
            --fixed-fps 60 --script res://tests/screenshots.gd -- "$PWD/ci-out/shots" 2>&1 | head -c 20000000 | tee ci-out/screenshots.log

      - name: Export web build
        if: always()
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build/web
          timeout -k 10 240 godot --headless --audio-driver Dummy --path . --export-release "Web" build/web/index.html 2>&1 | tee ci-out/export.log
          ls -la build/web | tee -a ci-out/export.log
          test -f build/web/index.html

      - name: Export the Mac app
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build/mac
          timeout -k 10 240 godot --headless --audio-driver Dummy --path . --export-release "macOS" build/mac/Tallowbone-mac.zip 2>&1 | head -c 20000000 | tee ci-out/export-mac.log
          ls -la build/mac | tee -a ci-out/export-mac.log
          test -f build/mac/Tallowbone-mac.zip

      - name: Flag script errors
        if: always()
        run: |
          # Godot logs script errors without always failing; fail on them here
          # and surface each one as an annotation.
          # (Resources still referenced at exit is shutdown noise, not a bug.)
          if grep -hE "SCRIPT ERROR|Parse Error|Failed to load|ERROR:" ci-out/*.log | grep -v "still in use at exit" > ci-out/errors.log; then
            head -40 ci-out/errors.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Publish logs and screenshots to ci-reports
        if: always() && github.event_name == 'push'
        run: |
          cd ci-out
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-reports
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "CI reports for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-reports

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Keep the Mac app
        # On the run's page under Artifacts (signed-in, kept two weeks).
        uses: actions/upload-artifact@v4
        with:
          name: Tallowbone-mac
          path: build/mac/Tallowbone-mac.zip
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  bench:
    # Times the web build in real browsers (Firefox and Chrome, drawn by the
    # CPU: there's no GPU here) with tools/bench_web.py and adds bench.md to
    # the ci-reports branch. Runs beside the deploy, not before it.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the web build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: bench-in

      - name: Benchmark in Firefox and Chrome
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri > /dev/null
          mkdir -p build/web && tar -xf bench-in/artifact.tar -C build/web
          firefox --version || true
          google-chrome --version || true
          python3 tools/bench_web.py build/web bench-out

      - name: Add the results to ci-reports
        if: always()
        run: |
          git fetch -q --depth 1 origin ci-reports
          git worktree add -q ../reports FETCH_HEAD
          mkdir -p ../reports/bench && cp -r bench-out/. ../reports/bench/
          cd ../reports
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Browser benchmark for ${GITHUB_SHA::7}"
          git push -q origin HEAD:ci-reports
